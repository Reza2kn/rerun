[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genesis-rerun"
version = "0.1.0"
description = "A live Genesis World to Rerun logging bridge: transforms, cameras, and sensors."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "rerun-sdk[dataplatform,dataloader]>=0.26.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The bridge imports with just numpy + rerun. Genesis is only needed to
# *produce* a scene; USD mesh/texture logging is an opt-in extra.
examples = ["genesis-world>=1.0.0"]
usd = ["usd-core>=23.0", "pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.11", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["genesis_rerun"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
